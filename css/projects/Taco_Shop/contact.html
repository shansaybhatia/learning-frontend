<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Shansay Bhatia" />
  <meta name="description" content="Contact Information for The Little Taco Shop" />
  <title>Contact Us - LTS</title>
  <link rel="stylesheet" href="css/style.css" type="text/css" />
  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
  <script src="js/main.js" defer></script>
</head>

<body>
  <header class="header">
    <h1 class="header__h1">Little Taco Shop</h1>
    <nav class="header__nav">
      <ul class="header__ul">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#menu">Menu</a></li>
        <li><a href="storeHours.html">Hours</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <figure>
      <img src="img/tacos_close_up_1000x649.png" alt="Little Taco Shop Tacos" title="Tacos ready to eat!" width="1000"
        height="649" />
      <figcaption class="offscreen">Little Taco Shop Tacos</figcaption>
    </figure>
  </section>

  <main class="main">
    <article class="main__article">
      <h2>Our Location</h2>
      <address>
        555 Taco Temptation Lane, Suite T <br />
        kansas City, MO 55555-55555 <br />
        <p>Phone: <a href="tel:+919999999999">+91 999-999-9999</a></p>
      </address>
    </article>
<hr>
    <article class="main__article contact">
      <h2 class="contact__h2">Our Contact Form</h2>
      <form action="https://httpbin.org/post" method="post" class="contact__form">
        <fieldset class="contact__fieldset">
          <legend class="offscreen">Send Us A Message</legend>
          <p class="contact__p">
            <label class="contact__lable" for="name">Name:</label>
            <input class="contact__input" type="text" name="name" id="name" placeholder="your name" required />
          </p>
          <p class="contact__p">
            <label class="contact__lable" for="email">Email</label>
            <input class="contact__input" type="email" name="email" id="email" placeholder="your email" required />
          </p>
          <p class="contact__p">
            <label class="contact__lable" for="message">Message:</label>
            <textarea class="contact__textarea" name="message" id="message" cols="50" rows="10"
              placeholder="Type your message here!"></textarea>
          </p>
        </fieldset>
        <button class="contact__button" type="submit">Send</button>
        <button class="contact__button" type="reset">Reset</button>
      </form>
    </article>
    <a href="#">Back to Top</a>
  </main>
  <footer class="footer">
    <p>
      <span class="nowrap">Copyright &copy; <time id="year"></time></span>
      <span class="nowrap">The Little Taco Shop</span>
    </p>
  </footer>
</body>

</html>
