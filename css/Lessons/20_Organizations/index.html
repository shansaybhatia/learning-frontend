<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEM Naming Convention</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1 class="header__title">BEM</h1>
      <nav class="header__nav">
        <button class="header__btn header__btn--border-lg">🚀</button>
        <button class="header__btn header__btn--secondary">🔥</button>
        <button class="header__btn header__btn--lean">🌮</button>
      </nav>
    </header>
  </body>
</html>

<!-- For elements two underscores then elements while for modifiers two dashes then modifiers -->
